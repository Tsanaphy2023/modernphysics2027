<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Research Lab: ZnO Nanoparticles &amp; Sweet Pepper Growth (2018)</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, 'Sarabun', sans-serif; background: #07111f; color: #e2e8f0; }
    .wrap { max-width: 1280px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
    .hdr { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; background: linear-gradient(135deg, #0f1e36 0%, #14332a 100%); border: 1px solid #2e4b45; border-radius: 14px; padding: 14px 18px; }
    .hdr h1 { margin: 4px 0 0; font-size: 20px; color: #f8fafc; }
    .kicker { font-size: 11px; font-weight: 800; color: #34d399; letter-spacing: 0.7px; }
    .grid { display: grid; grid-template-columns: 1.55fr 1fr; gap: 14px; }
    .panel { background: #0f172a; border: 1px solid #26374e; border-radius: 14px; padding: 14px; }
    #scene { width: 100%; height: 460px; border-radius: 10px; background: radial-gradient(circle at 50% 42%, #12312a, #060d18); position: relative; overflow: hidden; }
    .ctrl { margin-bottom: 12px; }
    .ctrl label { display: flex; justify-content: space-between; font-size: 13px; color: #cbd5e1; margin-bottom: 4px; }
    .ctrl input[type="range"] { width: 100%; accent-color: #34d399; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .btn { padding: 7px 12px; border-radius: 8px; border: 1px solid #34d399; background: rgba(52, 211, 153, 0.14); color: #d1fae5; font-weight: 700; font-size: 12.5px; cursor: pointer; text-decoration: none; }
    .btn.pri { background: #059669; color: #fff; }
    .metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
    .metric { background: #132531; border: 1px solid #274c4a; border-radius: 10px; padding: 8px 10px; }
    .metric span { display: block; font-size: 11px; color: #94a3b8; }
    .metric strong { font-size: 17px; color: #34d399; font-family: ui-monospace, monospace; }
    canvas#chart { width: 100%; height: 185px; display: block; border-radius: 8px; background: #091322; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  </style>
  <link rel="stylesheet" href="../shared/ct_physics_suite.css" />
</head>
<body>
  <div class="wrap">
    <div class="hdr">
      <div>
        <div class="kicker">RESEARCH-INFORMED 3D LAB · THASSANA ET AL. (2018) · 661/วิทย์</div>
        <h1>ผลของอนุภาคนาโน ZnO (E_g ≈ 3.37 eV) ต่อการเจริญเติบโตของพริกหวาน (แปลง 5 ต้น + เมล็ด + ราก)</h1>
      </div>
      <div class="btn-row" style="margin:0;">
        <a class="btn" href="../index.html">← กลับหน้าหลัก</a>
        <a class="btn" href="https://ph02.tci-thaijo.org/index.php/tsujournal/article/view/151746" target="_blank" rel="noopener">📄 อ่านบทความ ThaiJO</a>
      </div>
    </div>

    <div class="grid">
      <div class="panel"><div id="scene"></div></div>
      <div class="panel">
        <div class="btn-row">
          <button type="button" class="btn" data-conc="0">Control (0 mg/L)</button>
          <button type="button" class="btn pri" data-conc="20">Optimal (20 mg/L)</button>
          <button type="button" class="btn" data-conc="30">Nanosafety (30 mg/L)</button>
          <button type="button" class="btn" id="autoGrowBtn">▶ เล่นแอนิเมชันโต 1→6 สัปดาห์</button>
        </div>
        <div class="ctrl">
          <label><span>ความเข้มข้นอนุภาคนาโน ZnO</span><strong id="valConc">20 mg/L</strong></label>
          <input id="ctrlConc" type="range" min="0" max="30" step="1" value="20" />
        </div>
        <div class="ctrl">
          <label><span>ระยะเวลาหลังย้ายปลูก (สัปดาห์)</span><strong id="valWeek">6.0 สัปดาห์</strong></label>
          <input id="ctrlWeek" type="range" min="1" max="6" step="0.2" value="6" />
        </div>
        <div class="metrics" id="metrics"></div>
        <canvas id="chart"></canvas>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
    const $ = (id) => document.getElementById(id);
    const state = { conc: 20, week: 6.0, autoGrow: false };

    const sceneEl = $('scene');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(44, sceneEl.clientWidth / sceneEl.clientHeight, 0.1, 100);
    camera.position.set(0, 2.2, 10.6);
    camera.lookAt(0, 0.1, 0);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    renderer.setSize(sceneEl.clientWidth, sceneEl.clientHeight);
    sceneEl.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xd1fae5, 0x0f1f1c, 1.85));
    const dir = new THREE.DirectionalLight(0xffffff, 2.2);
    dir.position.set(4, 9, 7);
    scene.add(dir);

    const root = new THREE.Group();
    scene.add(root);
    let nanoParticles = [];
    let drag = false, lx = 0, ly = 0;
    renderer.domElement.addEventListener('pointerdown', (e) => { drag = true; lx = e.clientX; ly = e.clientY; });
    window.addEventListener('pointerup', () => { drag = false; });
    window.addEventListener('pointermove', (e) => {
      if (!drag) return;
      root.rotation.y += (e.clientX - lx) * 0.008;
      root.rotation.x = Math.max(-0.8, Math.min(0.8, root.rotation.x + (e.clientY - ly) * 0.006));
      lx = e.clientX; ly = e.clientY;
    });
    renderer.domElement.addEventListener('wheel', (e) => {
      e.preventDefault();
      camera.position.z = Math.max(5.5, Math.min(18, camera.position.z + e.deltaY * 0.01));
    }, { passive: false });

    function calcGrowth() {
      const c = state.conc;
      const wf = state.week / 6;
      const height6 = c <= 20 ? 19.48 + (22.36 - 19.48) * (c / 20) : 22.36 - 4.8 * ((c - 20) / 10);
      const root6 = c <= 20 ? 15.10 + (18.20 - 15.10) * (c / 20) : 18.20 - 4.1 * ((c - 20) / 10);
      const germ = c <= 20 ? 90 : 90 - 30 * ((c - 20) / 10);
      const moisture = c === 20 ? 84.02 : 79.5 + (c <= 20 ? c * 0.22 : (30 - c) * 0.35);
      return { height: height6 * (0.25 + 0.75 * wf), rootLen: root6 * (0.25 + 0.75 * wf), germ, moisture };
    }

    function addBellPepperFruit(parent, x, y, z, scale, colorHex) {
      const grp = new THREE.Group();
      grp.position.set(x, y, z);
      const mat = new THREE.MeshPhysicalMaterial({ color: colorHex, roughness: 0.22, clearcoat: 0.65 });
      for (let i = 0; i < 3; i++) {
        const lobe = new THREE.Mesh(new THREE.SphereGeometry(0.16 * scale, 12, 10), mat);
        const a = (i * Math.PI * 2) / 3;
        lobe.scale.set(0.85, 1.25, 0.85);
        lobe.position.set(Math.cos(a) * 0.06 * scale, 0, Math.sin(a) * 0.06 * scale);
        grp.add(lobe);
      }
      const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.03 * scale, 0.05 * scale, 0.14 * scale, 8), new THREE.MeshStandardMaterial({ color: 0x15803d }));
      cap.position.y = 0.2 * scale;
      grp.add(cap);
      parent.add(grp);
    }

    function addPepperPlant(px, plantIdx, g) {
      const grp = new THREE.Group();
      grp.position.set(px, 0, 0);
      // Seed at soil surface (y = -0.58)
      const seed = new THREE.Mesh(
        new THREE.SphereGeometry(0.14, 12, 10),
        new THREE.MeshPhysicalMaterial({ color: 0xfde68a, roughness: 0.45 })
      );
      seed.scale.set(1.2, 0.75, 0.45);
      seed.position.set(0, -0.58, 0);
      grp.add(seed);

      // Germination check (at 30 mg/L only 6/10 germinate -> last 2 plants stunted/un-sprouted!)
      const sprouted = !(state.conc >= 27 && plantIdx >= 3);
      const plantScale = sprouted ? (1 - plantIdx * 0.03) : 0.18;

      // Taproot + Lateral Fibrous Roots visible inside glass planter
      const rLen = (g.rootLen / 11) * plantScale;
      const rootMat = new THREE.MeshStandardMaterial({ color: 0xfef3c7, roughness: 0.55 });
      const tap = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.012, rLen, 8), rootMat);
      tap.position.set(0, -0.62 - rLen * 0.5, 0);
      grp.add(tap);

      const latCount = sprouted ? 6 : 2;
      for (let i = 0; i < latCount; i++) {
        const side = i % 2 === 0 ? 1 : -1;
        const lLen = rLen * (0.45 + (i % 3) * 0.14);
        const lat = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.008, lLen, 6), rootMat);
        lat.position.set(side * 0.18, -0.75 - (i / latCount) * rLen * 0.75, ((i % 3) - 1) * 0.12);
        lat.rotation.z = side * (0.55 + (i % 2) * 0.2);
        grp.add(lat);
      }

      if (!sprouted) {
        root.add(grp);
        return;
      }

      // Main Stem & Branches
      const sLen = (g.height / 7.2) * plantScale;
      const stemColor = state.conc >= 27 ? 0x65a30d : 0x16a34a;
      const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.08, sLen, 10), new THREE.MeshStandardMaterial({ color: stemColor }));
      stem.position.set(0, -0.55 + sLen * 0.5, 0);
      grp.add(stem);

      // Leaves
      const leafCount = Math.max(3, Math.round(3 + state.week * 1.4));
      const leafMat = new THREE.MeshPhysicalMaterial({ color: state.conc >= 27 ? 0x84cc16 : 0x22c55e, roughness: 0.32 });
      for (let i = 0; i < leafCount; i++) {
        const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.24, 12, 8), leafMat);
        leaf.scale.set(1.6, 0.18, 0.68);
        const ang = i * 2.25;
        const yy = -0.25 + (i / leafCount) * sLen;
        leaf.position.set(Math.cos(ang) * 0.34, yy, Math.sin(ang) * 0.34);
        leaf.rotation.y = -ang;
        leaf.rotation.z = 0.22;
        grp.add(leaf);
      }

      // Bell Pepper Fruits (appear week >= 3.5)
      if (state.week >= 3.5) {
        const fScale = Math.min(1.15, (state.week - 3.2) * 0.38) * plantScale;
        const fruitCols = [0xef4444, 0xfacc15, 0x16a34a];
        addBellPepperFruit(grp, 0.24, -0.2 + sLen * 0.72, 0.18, fScale, fruitCols[plantIdx % 3]);
        if (state.week >= 5) {
          addBellPepperFruit(grp, -0.22, -0.2 + sLen * 0.55, -0.15, fScale * 0.85, fruitCols[(plantIdx + 1) % 3]);
        }
      }
      root.add(grp);
    }

    function rebuildScene() {
      while (root.children.length) { const c = root.children[0]; root.remove(c); c.geometry?.dispose?.(); }
      nanoParticles = [];
      const g = calcGrowth();

      // Transparent Glass Observation Tray & Root Zone
      const glassTray = new THREE.Mesh(
        new THREE.BoxGeometry(8.8, 1.85, 2.2),
        new THREE.MeshPhysicalMaterial({ color: 0xa7f3d0, roughness: 0.08, transmission: 0.65, transparent: true, opacity: 0.22, side: THREE.DoubleSide })
      );
      glassTray.position.y = -1.45;
      root.add(glassTray);

      const soilLayer = new THREE.Mesh(
        new THREE.BoxGeometry(8.6, 0.18, 2.05),
        new THREE.MeshStandardMaterial({ color: 0x451a03, roughness: 0.9 })
      );
      soilLayer.position.y = -0.58;
      root.add(soilLayer);

      // 5 Sweet Pepper Plants across the tray
      [-3.1, -1.55, 0, 1.55, 3.1].forEach((px, idx) => addPepperPlant(px, idx, g));

      // Animated ZnO Nanoparticles (density proportional to state.conc)
      const npMat = new THREE.MeshPhysicalMaterial({ color: 0x38bdf8, emissive: 0x0284c7, emissiveIntensity: 0.6 });
      const count = Math.max(4, Math.round(state.conc * 1.4));
      for (let i = 0; i < count; i++) {
        const p = new THREE.Mesh(new THREE.SphereGeometry(0.06, 10, 8), npMat);
        p.userData = {
          baseX: ((i % 10) - 4.5) * 0.82,
          baseZ: ((i % 3) - 1) * 0.55,
          phase: i * 0.37,
        };
        nanoParticles.push(p);
        root.add(p);
      }

      if (window.MP27Labels) {
        root.add(
          window.MP27Labels.makeSprite(THREE, `แปลงพริกหวาน 5 ต้น (สูง ${g.height.toFixed(1)} cm)`, 0, 3.25, 0, '#34d399'),
          window.MP27Labels.makeSprite(THREE, 'เมล็ดพริกหวาน (Seeds)', -3.1, -0.2, 1.25, '#fde68a'),
          window.MP27Labels.makeSprite(THREE, `ระบบราก (ยาว ${g.rootLen.toFixed(1)} cm)`, 0, -2.55, 1.2, '#fbbf24'),
          window.MP27Labels.makeSprite(THREE, `อนุภาคนาโน ZnO (${state.conc} mg/L)`, 3.2, -1.1, 1.25, '#38bdf8')
        );
      }
    }

    function drawChart() {
      const c = $('chart');
      const r = c.getBoundingClientRect();
      c.width = r.width; c.height = r.height;
      const g = c.getContext('2d');
      g.clearRect(0, 0, r.width, r.height);
      const pts = [[0, 19.48], [10, 20.9], [20, 22.36], [30, 17.56]];
      g.strokeStyle = '#34d399'; g.lineWidth = 2.5;
      g.beginPath();
      pts.forEach(([x, y], i) => {
        const px = 42 + (x / 30) * (r.width - 64);
        const py = r.height - 26 - ((y - 14) / 10) * (r.height - 50);
        if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
      });
      g.stroke();
      const cur = calcGrowth();
      const cx = 42 + (state.conc / 30) * (r.width - 64);
      const cy = r.height - 26 - ((cur.height / (0.25 + 0.75 * (state.week / 6)) - 14) / 10) * (r.height - 50);
      g.fillStyle = '#fbbf24'; g.beginPath(); g.arc(cx, cy, 5, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#cbd5e1'; g.font = '11px system-ui, sans-serif';
      g.fillText('กราฟความสูงพริกหวาน (สัปดาห์ 6) vs ZnO (mg/L) • จุดสูงสุดที่ 20 mg/L', 42, 18);
    }

    function updateAll() {
      $('valConc').textContent = `${state.conc} mg/L`;
      $('valWeek').textContent = `${state.week.toFixed(1)} สัปดาห์`;
      const g = calcGrowth();
      $('metrics').innerHTML = `
        <div class="metric"><span>ความสูงต้น (Shoot)</span><strong>${g.height.toFixed(2)} cm</strong></div>
        <div class="metric"><span>ความยาวราก (Root)</span><strong>${g.rootLen.toFixed(2)} cm</strong></div>
        <div class="metric"><span>อัตราการงอก (Germination)</span><strong>${g.germ.toFixed(0)} %</strong></div>
        <div class="metric"><span>ความชื้น / E_g(ZnO)</span><strong>${g.moisture.toFixed(1)}% / 3.37 eV</strong></div>
      `;
      rebuildScene();
      drawChart();
    }

    $('ctrlConc').addEventListener('input', (e) => { state.conc = +e.target.value; updateAll(); });
    $('ctrlWeek').addEventListener('input', (e) => { state.week = +e.target.value; updateAll(); });
    document.querySelectorAll('[data-conc]').forEach((b) => b.addEventListener('click', () => {
      state.conc = +b.dataset.conc; state.week = 6;
      $('ctrlConc').value = state.conc; $('ctrlWeek').value = 6; updateAll();
    }));
    $('autoGrowBtn').addEventListener('click', () => {
      state.autoGrow = !state.autoGrow;
      $('autoGrowBtn').textContent = state.autoGrow ? '⏸ หยุดโตอัตโนมัติ' : '▶ เล่นแอนิเมชันโต 1→6 สัปดาห์';
      if (state.autoGrow && state.week >= 5.9) state.week = 1.0;
    });
    window.addEventListener('mp27:labels', () => { if (window.MP27Labels) window.MP27Labels.applyToRoot(root); });

    updateAll();
    let lastT = performance.now();
    function tick(now) {
      requestAnimationFrame(tick);
      const dt = Math.min(0.05, (now - lastT) / 1000);
      lastT = now;
      const t = now / 1000;
      if (state.autoGrow) {
        state.week += dt * 0.75;
        if (state.week > 6) state.week = 1;
        $('ctrlWeek').value = state.week.toFixed(1);
        updateAll();
      }
      nanoParticles.forEach((p) => {
        const u = ((t * 0.45 + p.userData.phase) % 1);
        p.position.set(
          p.userData.baseX + Math.sin(t * 2 + p.userData.phase) * 0.15,
          -2.1 + u * 2.6,
          p.userData.baseZ + Math.cos(t * 1.8 + p.userData.phase) * 0.12
        );
      });
      if (!drag) root.rotation.y = Math.sin(t * 0.25) * 0.22;
      renderer.render(scene, camera);
    }
    requestAnimationFrame(tick);
  </script>
  <script defer src="../shared/ct_physics_suite.js" data-ct-module="solid_state"></script>
</body>
</html>
