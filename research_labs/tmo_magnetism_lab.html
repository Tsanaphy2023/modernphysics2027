<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Research Lab: MnO &amp; NiO Magnetism (LSDA+U) — Asst. Prof. Dr. Chewa Thassana</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, 'Sarabun', sans-serif;
      background: #07111f;
      color: #e2e8f0;
    }
    .wrap {
      max-width: 1280px;
      margin: 0 auto;
      padding: 16px;
      display: grid;
      gap: 14px;
    }
    .hdr {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: linear-gradient(135deg, #0f1e36 0%, #1e293b 100%);
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 14px 18px;
    }
    .hdr h1 { margin: 4px 0 0; font-size: 20px; color: #f8fafc; }
    .kicker { font-size: 11px; font-weight: 800; color: #38bdf8; letter-spacing: 0.7px; }
    .grid {
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 14px;
    }
    .panel {
      background: #0f172a;
      border: 1px solid #26374e;
      border-radius: 14px;
      padding: 14px;
    }
    #scene {
      width: 100%;
      height: 430px;
      border-radius: 10px;
      background: radial-gradient(circle at 50% 40%, #16304d, #060d18);
      position: relative;
      overflow: hidden;
    }
    .ctrl { margin-bottom: 12px; }
    .ctrl label { display: flex; justify-content: space-between; font-size: 13px; color: #cbd5e1; margin-bottom: 4px; }
    .ctrl input[type="range"] { width: 100%; accent-color: #38bdf8; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .btn {
      padding: 7px 12px;
      border-radius: 8px;
      border: 1px solid #38bdf8;
      background: rgba(56, 189, 248, 0.14);
      color: #e0f2fe;
      font-weight: 700;
      font-size: 12.5px;
      cursor: pointer;
      text-decoration: none;
    }
    .btn.pri { background: #0284c7; color: #fff; }
    .metrics {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .metric {
      background: #17253a;
      border: 1px solid #2b4162;
      border-radius: 10px;
      padding: 8px 10px;
    }
    .metric span { display: block; font-size: 11px; color: #94a3b8; }
    .metric strong { font-size: 17px; color: #38bdf8; font-family: ui-monospace, monospace; }
    canvas#chart { width: 100%; height: 190px; display: block; border-radius: 8px; background: #091322; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  </style>
  <link rel="stylesheet" href="../shared/ct_physics_suite.css" />
</head>
<body>
  <div class="wrap">
    <div class="hdr">
      <div>
        <div class="kicker">RESEARCH-INFORMED 3D LAB · THASSANA &amp; TECHITDHEERA (2010, 2012)</div>
        <h1>จำลองโมเมนต์แม่เหล็กสปิน–ออร์บิทัลของผลึก MnO และ NiO (LSDA+U)</h1>
      </div>
      <div class="btn-row" style="margin:0;">
        <a class="btn" href="../index.html">← กลับหน้าหลัก</a>
        <a class="btn" href="https://doi.org/10.4028/www.scientific.net/AMM.110-116.492" target="_blank" rel="noopener">🔗 MnO (2012)</a>
        <a class="btn" href="https://doi.org/10.1109/INEC.2010.5425146" target="_blank" rel="noopener">🔗 NiO (2010)</a>
      </div>
    </div>

    <div class="grid">
      <div class="panel">
        <div id="scene"></div>
      </div>
      <div class="panel">
        <div class="btn-row">
          <button type="button" class="btn pri" id="preMno">🧲 Preset: MnO (AMM 2012)</button>
          <button type="button" class="btn" id="preNio">⚛️ Preset: NiO (IEEE INEC 2010)</button>
        </div>
        <div class="ctrl">
          <label><span>พลังงานคูลอมบ์ (Coulomb U)</span><strong id="valU">6.0 eV</strong></label>
          <input id="ctrlU" type="range" min="0" max="10" step="0.2" value="6.0" />
        </div>
        <div class="ctrl">
          <label><span>พลังงานแลกเปลี่ยน (Exchange J)</span><strong id="valJ">0.9 eV</strong></label>
          <input id="ctrlJ" type="range" min="0" max="2.0" step="0.05" value="0.9" />
        </div>
        <div class="ctrl">
          <label><span>การบีบอัดปริมาตรผลึก (ΔV / V₀)</span><strong id="valComp">0.0 %</strong></label>
          <input id="ctrlComp" type="range" min="-20" max="5" step="0.5" value="0" />
        </div>
        <div class="metrics" id="metrics"></div>
        <canvas id="chart"></canvas>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const state = {
      material: params.get('preset') === 'nio' ? 'NiO' : 'MnO',
      U: params.get('preset') === 'nio' ? 7.0 : 6.0,
      J: 0.9,
      comp: params.get('preset') === 'nio' ? -5.0 : 0.0,
    };

    const sceneEl = $('scene');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(44, sceneEl.clientWidth / sceneEl.clientHeight, 0.1, 100);
    camera.position.set(5.4, 3.8, 6.2);
    camera.lookAt(0, 0, 0);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    renderer.setSize(sceneEl.clientWidth, sceneEl.clientHeight);
    sceneEl.appendChild(renderer.domElement);
    window.MP27RegisterXR?.(renderer, scene, camera, THREE);

    scene.add(new THREE.HemisphereLight(0xcbe7ff, 0x102033, 1.8));
    const dir = new THREE.DirectionalLight(0xffffff, 2.2);
    dir.position.set(5, 8, 7);
    scene.add(dir);

    const root = new THREE.Group();
    scene.add(root);

    let drag = false, lx = 0, ly = 0;
    renderer.domElement.addEventListener('pointerdown', (e) => { drag = true; lx = e.clientX; ly = e.clientY; });
    window.addEventListener('pointerup', () => { drag = false; });
    window.addEventListener('pointermove', (e) => {
      if (!drag) return;
      root.rotation.y += (e.clientX - lx) * 0.008;
      root.rotation.x = Math.max(-1.1, Math.min(1.1, root.rotation.x + (e.clientY - ly) * 0.008));
      lx = e.clientX; ly = e.clientY;
    });

    function calcPhysics() {
      const Ueff = Math.max(0, state.U - state.J);
      const volScale = 1 + state.comp / 100;
      const a0 = state.material === 'MnO' ? 4.445 : 4.177;
      const a = a0 * Math.cbrt(volScale);
      const baseSpin = state.material === 'MnO' ? 4.35 : 1.62;
      const muS = (baseSpin + 0.075 * Ueff) * (1 + 0.004 * state.comp);
      const muL = state.material === 'MnO'
        ? 0.02 + 0.003 * Ueff
        : (0.28 + 0.022 * Ueff) * (1 + 0.006 * state.comp);
      const muTot = muS + muL;
      const gap = (state.material === 'MnO' ? 0.8 : 0.6) + 0.42 * Ueff;
      return { Ueff, a, muS, muL, muTot, gap };
    }

    function rebuildCrystal() {
      while (root.children.length) {
        const c = root.children[0];
        root.remove(c);
        c.geometry?.dispose?.();
      }
      const phys = calcPhysics();
      const sp = 1.45 * Math.cbrt(1 + state.comp / 100);
      const tmColor = state.material === 'MnO' ? 0xa855f7 : 0x22c55e;
      const tmMat = new THREE.MeshPhysicalMaterial({ color: tmColor, metalness: 0.45, roughness: 0.25, clearcoat: 0.4 });
      const oMat = new THREE.MeshPhysicalMaterial({ color: 0xef4444, metalness: 0.25, roughness: 0.3 });
      const arrowCol = state.material === 'MnO' ? 0xfbbf24 : 0x38bdf8;

      for (let ix = -1; ix <= 1; ix++) {
        for (let iy = -1; iy <= 1; iy++) {
          for (let iz = -1; iz <= 1; iz++) {
            const isTM = (Math.abs(ix + iy + iz) % 2) === 0;
            const m = new THREE.Mesh(new THREE.SphereGeometry(isTM ? 0.28 : 0.21, 20, 16), isTM ? tmMat : oMat);
            m.position.set(ix * sp, iy * sp, iz * sp);
            root.add(m);
            if (isTM) {
              const afmSign = ((ix + iy + iz) % 4 === 0) ? 1 : -1;
              const len = Math.min(1.15, 0.35 + phys.muTot * 0.14);
              const arrow = new THREE.ArrowHelper(new THREE.Vector3(0, afmSign, 0), m.position, len, arrowCol, 0.24, 0.14);
              root.add(arrow);
            }
          }
        }
      }
      if (window.MP27Labels) {
        root.add(
          window.MP27Labels.makeSprite(THREE, `${state.material} Cation + Spin`, 0, sp * 1.65, 0, '#fbbf24'),
          window.MP27Labels.makeSprite(THREE, 'O²⁻ Anion', sp * 1.35, -sp * 1.3, 0, '#f87171')
        );
      }
    }

    function drawChart(phys) {
      const c = $('chart');
      const r = c.getBoundingClientRect();
      c.width = r.width; c.height = r.height;
      const g = c.getContext('2d');
      g.clearRect(0, 0, r.width, r.height);
      g.strokeStyle = '#38bdf8'; g.lineWidth = 2.5;
      g.beginPath();
      for (let u = 0; u <= 10; u += 0.5) {
        const x = 44 + (u / 10) * (r.width - 64);
        const mu = (state.material === 'MnO' ? 4.35 : 1.62) + 0.075 * Math.max(0, u - state.J);
        const y = r.height - 28 - ((mu - 1.2) / 4.2) * (r.height - 52);
        if (u === 0) g.moveTo(x, y); else g.lineTo(x, y);
      }
      g.stroke();
      const cx = 44 + (state.U / 10) * (r.width - 64);
      const cy = r.height - 28 - ((phys.muS - 1.2) / 4.2) * (r.height - 52);
      g.fillStyle = '#fbbf24';
      g.beginPath(); g.arc(cx, cy, 5, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#cbd5e1'; g.font = '11px system-ui, sans-serif';
      g.fillText(`กราฟ μ_S vs Coulomb U (${state.material}) | กดดูจุดสีทอง`, 44, 18);
    }

    function updateAll() {
      $('valU').textContent = `${state.U.toFixed(1)} eV`;
      $('valJ').textContent = `${state.J.toFixed(2)} eV`;
      $('valComp').textContent = `${state.comp.toFixed(1)} %`;
      const p = calcPhysics();
      $('metrics').innerHTML = `
        <div class="metric"><span>Spin Moment (μ_S)</span><strong>${p.muS.toFixed(3)} μB</strong></div>
        <div class="metric"><span>Orbital Moment (μ_L)</span><strong>${p.muL.toFixed(3)} μB</strong></div>
        <div class="metric"><span>Total Moment (μ_tot)</span><strong>${p.muTot.toFixed(3)} μB</strong></div>
        <div class="metric"><span>Lattice a / Gap E_g</span><strong>${p.a.toFixed(2)} Å / ${p.gap.toFixed(2)} eV</strong></div>
      `;
      rebuildCrystal();
      drawChart(p);
    }

    $('ctrlU').value = state.U;
    $('ctrlComp').value = state.comp;
    $('ctrlU').addEventListener('input', (e) => { state.U = +e.target.value; updateAll(); });
    $('ctrlJ').addEventListener('input', (e) => { state.J = +e.target.value; updateAll(); });
    $('ctrlComp').addEventListener('input', (e) => { state.comp = +e.target.value; updateAll(); });
    $('preMno').addEventListener('click', () => { state.material = 'MnO'; state.U = 6.0; state.J = 0.9; state.comp = 0; $('ctrlU').value = 6.0; $('ctrlJ').value = 0.9; $('ctrlComp').value = 0; updateAll(); });
    $('preNio').addEventListener('click', () => { state.material = 'NiO'; state.U = 7.0; state.J = 0.9; state.comp = -5; $('ctrlU').value = 7.0; $('ctrlJ').value = 0.9; $('ctrlComp').value = -5; updateAll(); });
    window.addEventListener('mp27:labels', () => { if (window.MP27Labels) window.MP27Labels.applyToRoot(root); });

    updateAll();
    function tick() {
      requestAnimationFrame(tick);
      if (!drag) root.rotation.y += 0.004;
      renderer.render(scene, camera);
    }
    tick();
  </script>
  <script defer src="../shared/ct_physics_suite.js" data-ct-module="solid_state"></script>
</body>
</html>
